name: Bash Regression Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Bash syntax
        run: |
          for script in portctl.sh policy_engine.sh limit_ports.sh install.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Accounting regression tests
        run: bash tests/accounting.sh
      - name: Menu regression tests
        run: bash tests/menus.sh
      - name: Policy regression tests
        run: bash tests/policy.sh
      - name: Reliability regression tests
        run: bash tests/reliability.sh
      - name: Installer regression tests
        run: bash tests/install.sh
      - name: Optimization regression tests
        run: bash tests/optimizations.sh
      - name: Install network test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iptables
      - name: Linux kernel integration tests
        run: sudo unshare -n env PORTCTL_TEST_NETNS=1 bash tests/integration.sh
